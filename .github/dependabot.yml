# Version updates once a month, one grouped pull request per ecosystem, so
# Dependabot costs few Actions minutes. Rebasing is off: a pull request is
# rebased only when someone comments "@dependabot rebase".
version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    rebase-strategy: disabled
    groups:
      bun:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    rebase-strategy: disabled
    groups:
      github-actions:
        patterns:
          - '*'
